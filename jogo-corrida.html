<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Corrida Maluca</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>🏁 Corrida Maluca</h1>

<div id="gameContainer">
  <div id="hud">
    <span>Pontos: <span id="score">0</span></span>
    <span>Recorde: <span id="highScore">0</span></span>
  </div>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <h2 id="overlayTitle">Pronto para correr?</h2>
    <p id="overlayText">Desvie dos carros e colete as estrelas amarelas. Use as setas ← → ou A/D para mudar de pista.</p>
    <button id="startBtn">Começar</button>
  </div>
</div>

<div id="controls">Setas ← → (ou A/D) para mudar de pista &nbsp;|&nbsp; Espaço para pausar</div>

<div id="touchControls">
  <button id="btnLeft" aria-label="Mover para a esquerda">◀</button>
  <button id="btnPause" aria-label="Pausar ou continuar">⏸</button>
  <button id="btnRight" aria-label="Mover para a direita">▶</button>
</div>

<script src="game.js" defer></script>

</body>
</html>
