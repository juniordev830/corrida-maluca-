<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Corrida Maluca</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: linear-gradient(180deg, #7ec8f2 0%, #a8e6cf 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  h1 {
    color: #ffffff;
    text-shadow: 3px 3px 0 #ff6b6b, -1px -1px 0 #333;
    font-size: 2.2rem;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  #gameContainer {
    position: relative;
    width: 480px;
    max-width: 95vw;
    height: 640px;
    max-height: 80vh;
    background: linear-gradient(180deg, #5ec6f0 0%, #8fe3b8 100%);
    border: 6px solid #333;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 1.3rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 3px rgba(0,0,0,0.4);
    z-index: 10;
    pointer-events: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(20,20,30,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    z-index: 20;
  }

  #overlay h2 {
    font-size: 2rem;
    margin-bottom: 10px;
    color: #ffe66d;
  }

  #overlay p {
    font-size: 1rem;
    margin-bottom: 20px;
    max-width: 320px;
    line-height: 1.5;
  }

  button {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    padding: 12px 32px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(180deg, #ff9a56, #ff6b6b);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 #c0392b;
    transition: transform 0.1s;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c0392b;
  }

  #controls {
    margin-top: 14px;
    color: #333;
    font-size: 0.9rem;
    text-align: center;
    background: rgba(255,255,255,0.6);
    padding: 8px 16px;
    border-radius: 12px;
  }

  #touchControls {
    display: none;
    width: 480px;
    max-width: 95vw;
    justify-content: space-between;
    margin-top: 12px;
  }

  #touchControls button {
    width: 90px;
    height: 60px;
    font-size: 1.5rem;
    box-shadow: 0 4px 0 #999;
    background: linear-gradient(180deg, #fff, #ddd);
    color: #333;
  }

  @media (pointer: coarse) {
    #touchControls { display: flex; }
  }
</style>
</head>
<body>

<h1>🏁 Corrida Maluca</h1>

<div id="gameContainer">
  <div id="hud">
    <span>Pontos: <span id="score">0</span></span>
    <span>Recorde: <span id="highScore">0</span></span>
  </div>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <h2 id="overlayTitle">Pronto para correr?</h2>
    <p id="overlayText">Desvie dos carros e colete as estrelas amarelas. Use as setas ← → ou A/D para mudar de pista.</p>
    <button id="startBtn">Começar</button>
  </div>
</div>

<div id="controls">Setas ← → (ou A/D) para mudar de pista &nbsp;|&nbsp; Espaço para pausar</div>

<div id="touchControls">
  <button id="btnLeft" aria-label="Mover para a esquerda">◀</button>
  <button id="btnPause" aria-label="Pausar ou continuar">⏸</button>
  <button id="btnRight" aria-label="Mover para a direita">▶</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = 480;
  canvas.height = 640;
}
resizeCanvas();

const LANES = 3;
const laneWidth = canvas.width / LANES;

const player = {
  lane: 1,
  x: 0,
  y: canvas.height - 120,
  w: 46,
  h: 76,
  color: '#ff6b6b'
};

function laneX(lane) {
  return lane * laneWidth + laneWidth / 2 - player.w / 2;
}
player.x = laneX(player.lane);

let obstacles = [];
let stars = [];
let particles = [];
let roadLines = [];
let score = 0;
let highScore = Number.parseInt(localStorage_get('corridaMalucaHighScore'), 10) || 0;
let speed = 4;
let baseSpeed = 4;
let running = false;
let paused = false;
let gameOverFlag = false;
let frame = 0;
let spawnTimer = 0;
let starTimer = 0;

// Mantém o jogo funcional mesmo quando o navegador bloqueia o armazenamento.
let memoryStore = {};
function localStorage_get(key) {
  try { return window.localStorage.getItem(key) ?? memoryStore[key] ?? 0; }
  catch { return memoryStore[key] ?? 0; }
}
function localStorage_set(key, val) {
  memoryStore[key] = val;
  try { window.localStorage.setItem(key, String(val)); } catch { /* fallback em memória */ }
}

document.getElementById('highScore').textContent = highScore;

for (let i = 0; i < 8; i++) {
  roadLines.push({ y: i * 90 });
}

const carColors = ['#4a90d9', '#f4a940', '#9b59b6', '#2ecc71', '#e74c3c'];

function spawnObstacle() {
  const lane = Math.floor(Math.random() * LANES);
  obstacles.push({
    lane: lane,
    x: laneX(lane),
    y: -100,
    w: 46,
    h: 76,
    color: carColors[Math.floor(Math.random() * carColors.length)]
  });
}

function spawnStar() {
  const lane = Math.floor(Math.random() * LANES);
  stars.push({
    lane: lane,
    x: laneX(lane) + player.w / 2,
    y: -60,
    r: 14,
    collected: false
  });
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 14; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 30,
      color
    });
  }
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function drawRoundedCar(x, y, w, h, color, windowColor) {
  ctx.save();
  ctx.fillStyle = color;
  const r = 10;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = windowColor || 'rgba(255,255,255,0.6)';
  ctx.fillRect(x + 8, y + 12, w - 16, 18);
  ctx.fillRect(x + 8, y + h - 34, w - 16, 18);

  ctx.fillStyle = '#222';
  ctx.fillRect(x - 3, y + 10, 5, 14);
  ctx.fillRect(x + w - 2, y + 10, 5, 14);
  ctx.fillRect(x - 3, y + h - 24, 5, 14);
  ctx.fillRect(x + w - 2, y + h - 24, 5, 14);
  ctx.restore();
}

function update() {
  if (!running || paused || gameOverFlag) return;
  frame++;

  score += 0.12;
  speed = baseSpeed + Math.min(score / 200, 5);

  roadLines.forEach(l => {
    l.y += speed;
    if (l.y > canvas.height) l.y -= canvas.height + 90 * 8;
  });

  spawnTimer++;
  const spawnInterval = Math.max(55 - Math.floor(score / 8), 26);
  if (spawnTimer > spawnInterval) {
    spawnTimer = 0;
    spawnObstacle();
  }

  starTimer++;
  if (starTimer > 90) {
    starTimer = 0;
    if (Math.random() < 0.7) spawnStar();
  }

  const targetX = laneX(player.lane);
  player.x += (targetX - player.x) * 0.25;

  obstacles.forEach(o => o.y += speed);
  obstacles = obstacles.filter(o => o.y < canvas.height + 100);

  stars.forEach(s => s.y += speed);
  stars = stars.filter(s => s.y < canvas.height + 60 && !s.collected);

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);

  for (const o of obstacles) {
    if (rectsOverlap(player, o)) {
      endGame();
      return;
    }
  }

  for (const s of stars) {
    const dx = (player.x + player.w / 2) - s.x;
    const dy = (player.y + player.h / 2) - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < s.r + 26 && !s.collected) {
      s.collected = true;
      score += 15;
      spawnParticles(s.x, s.y, '#ffe66d');
    }
  }

  document.getElementById('score').textContent = Math.floor(score);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#6b7280');
  grad.addColorStop(1, '#4b5563');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#3d4451';
  ctx.fillRect(0, 0, 8, canvas.height);
  ctx.fillRect(canvas.width - 8, 0, 8, canvas.height);

  ctx.strokeStyle = '#f4f4f4';
  ctx.lineWidth = 4;
  ctx.setLineDash([30, 30]);
  for (let lane = 1; lane < LANES; lane++) {
    ctx.beginPath();
    ctx.moveTo(lane * laneWidth, 0);
    ctx.lineTo(lane * laneWidth, canvas.height);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  stars.forEach(s => {
    if (s.collected) return;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = '#ffe66d';
    ctx.strokeStyle = '#f4a940';
    ctx.lineWidth = 2;
    drawStar(0, 0, 5, s.r, s.r / 2.2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });

  obstacles.forEach(o => {
    drawRoundedCar(o.x, o.y, o.w, o.h, o.color);
  });

  if (running) {
    drawRoundedCar(player.x, player.y, player.w, player.h, player.color, 'rgba(200,230,255,0.8)');
  }

  particles.forEach(p => {
    ctx.globalAlpha = Math.max(p.life / 30, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawStar(cx, cy, spikes, outerR, innerR) {
  let rot = (Math.PI / 2) * 3;
  let x = cx, y = cy;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerR;
    y = cy + Math.sin(rot) * outerR;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerR;
    y = cy + Math.sin(rot) * innerR;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  obstacles = [];
  stars = [];
  particles = [];
  score = 0;
  speed = baseSpeed;
  player.lane = 1;
  player.x = laneX(1);
  frame = 0;
  spawnTimer = 0;
  starTimer = 0;
  gameOverFlag = false;
  paused = false;
  running = true;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('score').textContent = 0;
}

function endGame() {
  running = false;
  gameOverFlag = true;
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff6b6b');
  const finalScore = Math.floor(score);
  if (finalScore > highScore) {
    highScore = finalScore;
    localStorage_set('corridaMalucaHighScore', highScore);
    document.getElementById('highScore').textContent = highScore;
  }
  setTimeout(() => {
    document.getElementById('overlayTitle').textContent = 'Bateu! 💥';
    document.getElementById('overlayText').textContent = 'Pontuação final: ' + finalScore + '. Toque em jogar de novo para tentar bater o recorde!';
    document.getElementById('startBtn').textContent = 'Jogar de novo';
    document.getElementById('overlay').style.display = 'flex';
  }, 400);
}

function togglePause() {
  if (!running || gameOverFlag) return;
  paused = !paused;
  document.getElementById('overlay').style.display = paused ? 'flex' : 'none';
  if (paused) {
    document.getElementById('overlayTitle').textContent = 'Pausado';
    document.getElementById('overlayText').textContent = 'Toque em continuar para voltar à corrida.';
    document.getElementById('startBtn').textContent = 'Continuar';
  }
}

document.getElementById('startBtn').addEventListener('click', () => {
  if (paused) {
    paused = false;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('startBtn').textContent = 'Continuar';
  } else {
    startGame();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
    player.lane = Math.max(0, player.lane - 1);
  } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
    player.lane = Math.min(LANES - 1, player.lane + 1);
  } else if (e.code === 'Space') {
    e.preventDefault();
    if (!running && !gameOverFlag) return;
    togglePause();
  }
});

document.getElementById('btnLeft').addEventListener('click', () => {
  player.lane = Math.max(0, player.lane - 1);
});
document.getElementById('btnRight').addEventListener('click', () => {
  player.lane = Math.min(LANES - 1, player.lane + 1);
});
document.getElementById('btnPause').addEventListener('click', togglePause);

let touchStartX = null;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
});
canvas.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 30) player.lane = Math.min(LANES - 1, player.lane + 1);
  else if (dx < -30) player.lane = Math.max(0, player.lane - 1);
  touchStartX = null;
});

draw();
loop();
</script>

</body>
</html>
