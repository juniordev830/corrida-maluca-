name: Corrida Maluca CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar código JavaScript
        run: npm run check
      - name: Executar testes de jogabilidade
        run: npm test
      - name: Gerar pacote web para Android
        run: npm run build:web

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar SDK Android
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar projeto Android
        run: npm run android:add
      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: corrida-maluca-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
