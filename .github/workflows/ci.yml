name: Corrida Maluca CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar código JavaScript
        run: npm run check
      - name: Executar testes de jogabilidade
        run: npm test
      - name: Gerar pacote web para Android
        run: npm run build:web
