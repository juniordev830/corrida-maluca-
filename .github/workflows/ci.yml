name: Browser Game CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("jogo-corrida.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("Nenhum bloco JavaScript encontrado")
          Path("/tmp/game-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/game-inline.js
